<rect class="card" x="1170.0" y="1280" width="260" height="340" rx="5"/>
<text x="1192.0" y="1316" class="heading" text-anchor="start">Positioning &amp;</text>
<text x="1192.0" y="1347" class="heading" text-anchor="start">messaging</text>
<text x="1192.0" y="1390" class="body" text-anchor="start">• PMM</text>
<text x="1192.0" y="1420" class="body" text-anchor="start">• Approved narrative</text>
<text x="1192.0" y="1450" class="body" text-anchor="start">• Messaging</text>
<text x="1192.0" y="1480" class="body" text-anchor="start">  database</text>
<rect class="card" x="1450.0" y="1280" width="260" height="340" rx="5"/>
<text x="1472.0" y="1316" class="heading" text-anchor="start">Pricing &amp;</text>
<text x="1472.0" y="1347" class="heading" text-anchor="start">packaging</text>
<text x="1472.0" y="1390" class="body" text-anchor="start">• Product + Revenue</text>
<text x="1472.0" y="1420" class="body" text-anchor="start">  + PMM</text>
<text x="1472.0" y="1450" class="body" text-anchor="start">• Agree pricing before</text>
<text x="1472.0" y="1480" class="body" text-anchor="start">  assets</text>
<rect class="card" x="1730.0" y="1280" width="260" height="340" rx="5"/>
<text x="1752.0" y="1316" class="heading" text-anchor="start">Enablement</text>
<text x="1752.0" y="1359" class="body" text-anchor="start">• Owner: Enablement</text>
<text x="1752.0" y="1389" class="body" text-anchor="start">• Training and</text>
<text x="1752.0" y="1419" class="body" text-anchor="start">  internal FAQ</text>
<rect class="card" x="2010.0" y="1280" width="260" height="340" rx="5"/>
<text x="2032.0" y="1316" class="heading" text-anchor="start">GTM toolkit</text>
<text x="2032.0" y="1359" class="body" text-anchor="start">• PMM + contributors</text>
<text x="2032.0" y="1389" class="body" text-anchor="start">• One-pager,</text>
<text x="2032.0" y="1419" class="body" text-anchor="start">  battlecard and sales</text>
<text x="2032.0" y="1449" class="body" text-anchor="start">  deck</text>
<rect class="card" x="2290.0" y="1280" width="260" height="340" rx="5"/>
<text x="2312.0" y="1316" class="heading" text-anchor="start">Campaigns &amp;</text>
<text x="2312.0" y="1347" class="heading" text-anchor="start">collateral</text>
<text x="2312.0" y="1390" class="body" text-anchor="start">• Channel owners</text>
<text x="2312.0" y="1420" class="body" text-anchor="start">• Blog, video and</text>
<text x="2312.0" y="1450" class="body" text-anchor="start">  distribution</text>
<rect class="card" x="2570.0" y="1280" width="260" height="340" rx="5"/>
<text x="2592.0" y="1316" class="heading" text-anchor="start">Knowledge &amp;</text>
<text x="2592.0" y="1347" class="heading" text-anchor="start">support</text>
<text x="2592.0" y="1390" class="body" text-anchor="start">• Product + CX /</text>
<text x="2592.0" y="1420" class="body" text-anchor="start">  Support</text>
<text x="2592.0" y="1450" class="body" text-anchor="start">• Help docs and</text>
<text x="2592.0" y="1480" class="body" text-anchor="start">  escalation</text>
<rect class="card" x="2850.0" y="1280" width="260" height="340" rx="5"/>
<text x="2872.0" y="1316" class="heading" text-anchor="start">Misc.</text>
<text x="2872.0" y="1359" class="body" text-anchor="start">• Owner: assigned as</text>
<text x="2872.0" y="1389" class="body" text-anchor="start">  needed</text>
<text x="2872.0" y="1419" class="body" text-anchor="start">• Other launch tasks</text>
<text x="2872.0" y="1449" class="body" text-anchor="start">• Set owner and due</text>
<text x="2872.0" y="1479" class="body" text-anchor="start">  date</text>
<text x="50" y="1670" class="body" text-anchor="start">Proposed ownership and gates · validate against internal policy</text>
