<rect class="card" x="580.0" y="820" width="360" height="340" rx="5"/>
<text x="602.0" y="856" class="heading" text-anchor="start">Agree tier, scope &amp; rollout</text>
<text x="602.0" y="899" class="body" text-anchor="start">• Agree launch size and rollout</text>
<text x="602.0" y="929" class="body" text-anchor="start">• Name owners and approvers</text>
<text x="602.0" y="959" class="body" text-anchor="start">• Confirm dates and</text>
<text x="602.0" y="989" class="body" text-anchor="start">  dependencies</text>
<text x="602.0" y="1019" class="body" text-anchor="start">• Choose only the assets</text>
<text x="602.0" y="1049" class="body" text-anchor="start">  needed</text>
<rect class="card" x="1040.0" y="820" width="360" height="340" rx="5"/>
<text x="1062.0" y="856" class="heading" text-anchor="start">Build the plan</text>
<text x="1062.0" y="899" class="body" text-anchor="start">• Use PRD and customer</text>
<text x="1062.0" y="929" class="body" text-anchor="start">  evidence</text>
<text x="1062.0" y="959" class="body" text-anchor="start">• Define audience and message</text>
<text x="1062.0" y="989" class="body" text-anchor="start">• Choose channels and</text>
<text x="1062.0" y="1019" class="body" text-anchor="start">  measures</text>
<text x="1062.0" y="1049" class="body" text-anchor="start">• Scope potential automation</text>
<text x="1062.0" y="1079" class="body" text-anchor="start">• Automation may be partial</text>
<text x="1062.0" y="1109" class="body" text-anchor="start">• PMM owns the strategy</text>
<rect class="card" x="1500.0" y="820" width="360" height="340" rx="5"/>
<text x="1522.0" y="856" class="heading" text-anchor="start">Linked launch workspace</text>
<text x="1522.0" y="899" class="body" text-anchor="start">• Linear project and tasks</text>
<text x="1522.0" y="929" class="body" text-anchor="start">• Strategy document and</text>
<text x="1522.0" y="959" class="body" text-anchor="start">  timeline</text>
<text x="1522.0" y="989" class="body" text-anchor="start">• Slack channel and owners</text>
<text x="1522.0" y="1019" class="body" text-anchor="start">• Create after approval</text>
<text x="1522.0" y="1049" class="body" text-anchor="start">• Reuse existing projects</text>
<rect class="card" x="2400.0" y="820" width="400" height="340" rx="5"/>
<text x="2422.0" y="856" class="heading" text-anchor="start">Beta and GA checks</text>
<text x="2422.0" y="899" class="body" text-anchor="start">• Beta gate: ready for beta users?</text>
<text x="2422.0" y="929" class="body" text-anchor="start">• Monitor bugs and user feedback</text>
<text x="2422.0" y="959" class="body" text-anchor="start">• GA gate: ready for wider release?</text>
<text x="2422.0" y="989" class="body" text-anchor="start">• PMM checks assets and training</text>
<text x="2422.0" y="1019" class="body" text-anchor="start">• Product confirms product</text>
<text x="2422.0" y="1049" class="body" text-anchor="start">  readiness</text>
<text x="2422.0" y="1079" class="body" text-anchor="start">• Fix blockers before each gate</text>
<rect class="card" x="2880.0" y="820" width="360" height="340" rx="5"/>
<text x="2902.0" y="856" class="heading" text-anchor="start">Post-launch review</text>
<text x="2902.0" y="899" class="body" text-anchor="start">• Compare results with targets</text>
<text x="2902.0" y="929" class="body" text-anchor="start">• Review use and customer</text>
<text x="2902.0" y="959" class="body" text-anchor="start">  feedback</text>
<text x="2902.0" y="989" class="body" text-anchor="start">• Assign next steps and owners</text>
