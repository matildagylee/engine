<path class="wire" d="M 1860.0 645 H 1954.0" marker-end="url(#arrow)"/>
<path class="wire" d="M 2320.0 645 H 2414.0" marker-end="url(#arrow)"/>
<path class="wire" d="M 2780.0 645 H 2874.0" marker-end="url(#arrow)"/>
<rect class="card" x="120.0" y="560" width="360" height="170" rx="5"/>
<text x="300" y="596" class="heading" text-anchor="middle">1. Scope &amp; PRD</text>
<text x="300" y="639" class="body" text-anchor="middle">Product</text>
<rect class="card" x="580.0" y="560" width="360" height="170" rx="5"/>
<text x="760" y="596" class="heading" text-anchor="middle">2. Align the launch team</text>
<text x="760" y="639" class="body" text-anchor="middle">Product + PMM</text>
<text x="760" y="669" class="body" text-anchor="middle">PgM, if applicable</text>
<rect class="card" x="1040.0" y="560" width="360" height="170" rx="5"/>
<text x="1220" y="596" class="heading" text-anchor="middle">3. Build GTM +</text>
<text x="1220" y="627" class="heading" text-anchor="middle">launch strategy</text>
<text x="1220" y="670" class="body" text-anchor="middle">Owner: PMM</text>
<rect class="card" x="1500.0" y="560" width="360" height="170" rx="5"/>
<text x="1680" y="596" class="heading" text-anchor="middle">4. Approve &amp; create</text>
<text x="1680" y="627" class="heading" text-anchor="middle">workspace</text>
<text x="1680" y="670" class="body" text-anchor="middle">PMM + Product approve</text>
<text x="1680" y="700" class="body" text-anchor="middle">Automation creates</text>
<rect class="card" x="1960.0" y="560" width="360" height="170" rx="5"/>
<text x="2140" y="596" class="heading" text-anchor="middle">5. Execute workstreams</text>
<text x="2140" y="639" class="body" text-anchor="middle">Named owner per deliverable</text>
<rect class="card" x="2420.0" y="560" width="360" height="170" rx="5"/>
<text x="2600" y="596" class="heading" text-anchor="middle">6. Readiness decision</text>
<text x="2600" y="639" class="body" text-anchor="middle">Beta gate + GA gate</text>
<text x="2600" y="669" class="body" text-anchor="middle">Product monitors readiness</text>
<rect class="card" x="2880.0" y="560" width="360" height="170" rx="5"/>
<text x="3060" y="596" class="heading" text-anchor="middle">7. Launch, measure &amp; learn</text>
<text x="3060" y="639" class="body" text-anchor="middle">Owners monitor outcomes</text>
<path class="wire" d="M 300 730 V 775"/>
<path class="wire" d="M 300 775 H 170 V 808" marker-end="url(#arrow)"/>
<path class="wire" d="M 300 775 H 430 V 808" marker-end="url(#arrow)"/>
<rect class="card" x="50.0" y="820" width="240" height="340" rx="5"/>
<text x="72.0" y="856" class="heading" text-anchor="start">PRD inputs</text>
<text x="72.0" y="899" class="body" text-anchor="start">• What we are</text>
<text x="72.0" y="929" class="body" text-anchor="start">  building</text>
<text x="72.0" y="959" class="body" text-anchor="start">• Why and for</text>
<text x="72.0" y="989" class="body" text-anchor="start">  whom</text>
<text x="72.0" y="1019" class="body" text-anchor="start">• GA scope and</text>
<text x="72.0" y="1049" class="body" text-anchor="start">  exclusions</text>
<text x="72.0" y="1079" class="body" text-anchor="start">• Expected impact</text>
<text x="72.0" y="1109" class="body" text-anchor="start">• Dependencies</text>
<rect class="card" x="310.0" y="820" width="240" height="340" rx="5"/>
<text x="332.0" y="856" class="heading" text-anchor="start">Success</text>
<text x="332.0" y="887" class="heading" text-anchor="start">definition</text>
<text x="332.0" y="930" class="body" text-anchor="start">• Starting point and</text>
<text x="332.0" y="960" class="body" text-anchor="start">  target</text>
<text x="332.0" y="990" class="body" text-anchor="start">• Who tracks</text>
<text x="332.0" y="1020" class="body" text-anchor="start">  results</text>
<text x="332.0" y="1050" class="body" text-anchor="start">• Expected release</text>
<text x="332.0" y="1080" class="body" text-anchor="start">  dates</text>
<rect class="card" x="270.0" y="270" width="180" height="150" rx="5"/>
<text x="360" y="318" class="body" text-anchor="middle">PMM</text>
<path class="wire" d="M 360 420 V 460"/>
<rect class="card" x="470.0" y="270" width="180" height="150" rx="5"/>
<text x="560" y="318" class="body" text-anchor="middle">Enablement</text>
<path class="wire" d="M 560 420 V 460"/>
<rect class="card" x="670.0" y="270" width="180" height="150" rx="5"/>
<text x="760" y="318" class="body" text-anchor="middle">PgM</text>
<text x="760" y="348" class="body" text-anchor="middle">if applicable</text>
<path class="wire" d="M 760 420 V 460"/>
<rect class="card" x="870.0" y="270" width="180" height="150" rx="5"/>
<text x="960" y="318" class="body" text-anchor="middle">GTM</text>
<text x="960" y="348" class="body" text-anchor="middle">champion</text>
<path class="wire" d="M 960 420 V 460"/>
<rect class="card" x="1070.0" y="270" width="180" height="150" rx="5"/>
<text x="1160" y="318" class="body" text-anchor="middle">Executive</text>
<text x="1160" y="348" class="body" text-anchor="middle">sponsor</text>
<text x="1160" y="378" class="body" text-anchor="middle">as needed</text>
<path class="wire" d="M 1160 420 V 460"/>
<path class="wire" d="M 360 460 H 1160"/>
<path class="wire" d="M 760 460 V 548" marker-end="url(#arrow)"/>
